<svg xmlns="http://www.w3.org/2000/svg" class="framework-svg architecture" data-framework-panel="endpoint-encoder" viewBox="0 0 480 320" role="img" aria-labelledby="endpoint-encoder-title endpoint-encoder-desc"><title id="endpoint-encoder-title">Exposure-Aware Endpoint Encoder</title><desc id="endpoint-encoder-desc">TD, RGB and SD inputs each carry the 0/1 endpoint subscript. Three aligned hierarchical branches encode each endpoint. At every encoded scale, TD enters the named Cross-Attention Fusion region from above and SD from below, conditioning the RGB hierarchy inside. The native RGB feature and the three fused encoded RGB features feed F_end,0/1 through a separate output lane below the RGB blocks. The Four Scales caption and stacked feature glyph are omitted.</desc><style>
.framework-svg text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #172435; font-size: 20px; }
.framework-svg .heading { font-size: 24px; font-weight: 650; }
.framework-svg .subheading { font-size: 21px; font-weight: 600; }
.framework-svg .small { font-size: 17px; fill: #536477; }
.framework-svg .micro { font-size: 15px; fill: #536477; }
.framework-svg .math { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 22px; }
.framework-svg .numeric-index { font-family: Arial, Helvetica, sans-serif; font-style: normal; font-weight: 600; font-variant-numeric: lining-nums tabular-nums; }
.framework-svg .blue { fill: #234e98; }
.framework-svg .warm { fill: #92501f; }
.framework-svg .module { fill: #fbe6d3; stroke: #a65b28; stroke-width: 1.7; }
.framework-svg .block { fill: #f5c39c; stroke: #a65b28; stroke-width: 1.7; }
.framework-svg .label { paint-order: stroke; stroke: white; stroke-width: 5px; stroke-linejoin: round; }
.framework-svg .edge { fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.framework-svg .scan { animation: scan-time 5.8s linear infinite; pointer-events: none; }
.framework-svg.architecture text { font-weight: 600; }
.framework-svg.architecture .heading, .framework-svg.architecture .subheading { font-weight: 650; }
.framework-svg.architecture .module-label { font-weight: 600; }
.framework-svg.architecture .math { font-weight: 550; }
.framework-svg.architecture .small, .framework-svg.architecture .micro { font-weight: 500; }
.framework-svg .diagram-group { --focus-color: #648ac3; --focus-tint: #eef4fc; }
.framework-svg .diagram-group.warm-focus { --focus-color: #ae652e; --focus-tint: #fff0df; }
.framework-svg [data-hotspot] { cursor: pointer; outline: none; }
.framework-svg .focus-surface, .framework-svg .thumbnail { transition: fill .18s ease, stroke .18s ease, stroke-width .18s ease, filter .18s ease; }
.framework-svg .focus-band { fill: var(--focus-tint); stroke: var(--focus-color); stroke-width: 1.6; opacity: 0; pointer-events: none; transition: opacity .18s ease; }
.framework-svg .diagram-group.is-highlighted > .focus-surface { fill: var(--focus-tint); stroke: var(--focus-color); stroke-width: 2.5; filter: drop-shadow(0 2px 3px rgb(38 64 100 / .16)); }
.framework-svg .diagram-group.is-highlighted > .focus-band { opacity: .8; }
.framework-svg .diagram-group.is-highlighted .thumbnail { stroke: var(--focus-color); stroke-width: 2.4; filter: drop-shadow(0 2px 3px rgb(38 64 100 / .22)); }
.framework-svg .endpoint-frame { fill: var(--focus-tint); stroke: var(--focus-color); stroke-width: 2.5; opacity: 0; pointer-events: none; transition: opacity .18s ease; }
.framework-svg .exposure-window { transition: fill .18s ease, stroke .18s ease; }
.framework-svg .diagram-group.is-highlighted > .endpoint-frame { opacity: 1; filter: drop-shadow(0 2px 3px rgb(38 64 100 / .16)); }
.framework-svg .diagram-group.is-highlighted > .exposure-window { fill: transparent; stroke: transparent; }
.framework-svg[data-framework-panel="measurements"] .diagram-group[data-highlight^="endpoint-"].is-highlighted .thumbnail { stroke: #d4dfea; stroke-width: 1; filter: none; }
@keyframes scan-time { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: .7; } 92% { opacity: .7; } 100% { transform: translateX(360px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .framework-svg .scan { display: none; animation: none; } .framework-svg .focus-surface, .framework-svg .thumbnail, .framework-svg .focus-band, .framework-svg .endpoint-frame, .framework-svg .exposure-window { transition: none; } }
</style><defs><marker id="endpoint-encoder-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#547db8"/></marker><marker id="endpoint-encoder-arrow-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#b8692c"/></marker></defs><g class="diagram-group warm-focus" data-highlight="encoder" data-hotspot="encoder" tabindex="0" role="button" aria-pressed="false" aria-label="Highlight both endpoint encoders and their detailed architecture"><rect x="1" y="1" width="478" height="318" rx="14" fill="#fff" stroke="#e3cbb4" class="focus-surface"/><text x="20" y="34" class="subheading warm" text-anchor="start" style="font-size:22px">Exposure-Aware Endpoint Encoder</text><g data-encoder-fusion=""><rect x="114" y="118" width="272" height="120" rx="10" fill="#fff3e6" stroke="#d5a77f" class="fusion-region"/><text x="250" y="146" class="subheading warm" text-anchor="middle" style="font-size:18px">Cross-Attention Fusion</text><path d="M158 105.0 V116" class="edge" stroke="#b8692c" marker-end="url(#endpoint-encoder-arrow-warm)"/><path d="M158 254.0 V240" class="edge" stroke="#b8692c" marker-end="url(#endpoint-encoder-arrow-warm)"/><path d="M260 99.0 V116" class="edge" stroke="#b8692c" marker-end="url(#endpoint-encoder-arrow-warm)"/><path d="M260 260.0 V240" class="edge" stroke="#b8692c" marker-end="url(#endpoint-encoder-arrow-warm)"/><path d="M360 95.0 V116" class="edge" stroke="#b8692c" marker-end="url(#endpoint-encoder-arrow-warm)"/><path d="M360 264.0 V240" class="edge" stroke="#b8692c" marker-end="url(#endpoint-encoder-arrow-warm)"/></g><g data-encoder-input="TD"><g class="diagram-group" data-highlight="endpoint-inputs" data-hotspot="endpoint-inputs" tabindex="0" role="button" aria-pressed="false" aria-label="Highlight the shared TD, RGB and SD inputs for both endpoints"><rect x="14" y="59" width="82" height="48" rx="8" fill="#fff7ee" stroke="#dbb18b" class="focus-surface encoder-input-label"/><text x="22" y="90" class="math" text-anchor="start" style="font-size:22px">TD<tspan baseline-shift="sub" font-size="65%"><tspan class="numeric-index">0</tspan>/<tspan class="numeric-index">1</tspan></tspan><tspan baseline-shift="super" font-size="65%">in</tspan></text></g><path d="M104 83 H137" class="edge" stroke="#b8692c" marker-end="url(#endpoint-encoder-arrow-warm)"/><rect x="140" y="61.0" width="36" height="44" rx="6" fill="#fff" stroke="#e0e6eb" class="block"/><rect x="240" y="67.0" width="40" height="32" rx="6" fill="#fff" stroke="#e0e6eb" class="block"/><rect x="340" y="71.0" width="40" height="24" rx="6" fill="#fff" stroke="#e0e6eb" class="block"/><path d="M178 83 H237" class="edge" stroke="#b8692c" marker-end="url(#endpoint-encoder-arrow-warm)"/><path d="M282 83 H337" class="edge" stroke="#b8692c" marker-end="url(#endpoint-encoder-arrow-warm)"/></g><g data-encoder-input="RGB"><g class="diagram-group" data-highlight="endpoint-inputs" data-hotspot="endpoint-inputs" tabindex="0" role="button" aria-pressed="false" aria-label="Highlight the shared TD, RGB and SD inputs for both endpoints"><rect x="14" y="162" width="82" height="48" rx="8" fill="#fff7ee" stroke="#dbb18b" class="focus-surface encoder-input-label"/><text x="22" y="193" class="math" text-anchor="start" style="font-size:22px">RGB<tspan baseline-shift="sub" font-size="65%"><tspan class="numeric-index">0</tspan>/<tspan class="numeric-index">1</tspan></tspan><tspan baseline-shift="super" font-size="65%"></tspan></text></g><path d="M104 186 H137" class="edge" stroke="#b8692c" marker-end="url(#endpoint-encoder-arrow-warm)"/><rect x="140" y="164.0" width="36" height="44" rx="6" fill="#fff" stroke="#e0e6eb" class="block"/><rect x="240" y="170.0" width="40" height="32" rx="6" fill="#fff" stroke="#e0e6eb" class="block"/><rect x="340" y="174.0" width="40" height="24" rx="6" fill="#fff" stroke="#e0e6eb" class="block"/><path d="M178 186 H237" class="edge" stroke="#b8692c" marker-end="url(#endpoint-encoder-arrow-warm)"/><path d="M282 186 H337" class="edge" stroke="#b8692c" marker-end="url(#endpoint-encoder-arrow-warm)"/></g><g data-encoder-input="SD"><g class="diagram-group" data-highlight="endpoint-inputs" data-hotspot="endpoint-inputs" tabindex="0" role="button" aria-pressed="false" aria-label="Highlight the shared TD, RGB and SD inputs for both endpoints"><rect x="14" y="252" width="82" height="48" rx="8" fill="#fff7ee" stroke="#dbb18b" class="focus-surface encoder-input-label"/><text x="22" y="283" class="math" text-anchor="start" style="font-size:22px">SD<tspan baseline-shift="sub" font-size="65%"><tspan class="numeric-index">0</tspan>/<tspan class="numeric-index">1</tspan></tspan><tspan baseline-shift="super" font-size="65%">in</tspan></text></g><path d="M104 276 H137" class="edge" stroke="#b8692c" marker-end="url(#endpoint-encoder-arrow-warm)"/><rect x="140" y="254.0" width="36" height="44" rx="6" fill="#fff" stroke="#e0e6eb" class="block"/><rect x="240" y="260.0" width="40" height="32" rx="6" fill="#fff" stroke="#e0e6eb" class="block"/><rect x="340" y="264.0" width="40" height="24" rx="6" fill="#fff" stroke="#e0e6eb" class="block"/><path d="M178 276 H237" class="edge" stroke="#b8692c" marker-end="url(#endpoint-encoder-arrow-warm)"/><path d="M282 276 H337" class="edge" stroke="#b8692c" marker-end="url(#endpoint-encoder-arrow-warm)"/></g><g data-encoder-output=""><path d="M110 186 V230 H398" class="edge" stroke="#b8692c" marker-end="url(#endpoint-encoder-arrow-warm)"/><path d="M158 208 V225 H398" class="edge" stroke="#b8692c" marker-end="url(#endpoint-encoder-arrow-warm)"/><path d="M260 202 V220 H398" class="edge" stroke="#b8692c" marker-end="url(#endpoint-encoder-arrow-warm)"/><path d="M360 198 V215 H398" class="edge" stroke="#b8692c" marker-end="url(#endpoint-encoder-arrow-warm)"/><text x="406" y="234" class="math" text-anchor="start" style="font-size:20px">F<tspan baseline-shi